openapi: 3.0.3
info:
  title: IoT Things v2 API
  version: 1.0.0
  description: >-
    Hanterings-API för verksamhetsobjekt (saker) skapade från versionerade
    mallar. Publicerade mall-/variantversioner är oföränderliga; ändringar
    av saker kräver aktuell revision via If-Match (svarar 409 vid konflikt)
    och returnerar ny revision som ETag ("rev-<n>"). Alla saker kräver namn,
    plats och kategori (ärvd från mallen eller egen); metadata är frivillig.
    Användare med flera tenants får som standard alla de har access till
    (läsningar fanar ut serverside; ?tenant= filtrerar till en).
    Enskilda sak-anrop kräver entydig träff (0 -> 404, flera -> 400);
    skrivningar kräver exakt en tenant (?tenant= vid tvetydighet).
    Muterande anrop dränerar livscykel-/relationshändelser inline: ett 500-svar
    efter lyckad validering kan betyda att tillståndet sparats men
    publiceringen väntar i outbox (levereras vid omstart); läs aktuellt
    tillstånd via GET i stället för blindt återförsök.
    Utgående topics (isoleraade v1-kontrakt): things.v1.values (mätvärden med
    sakdeskriptor), things.v1.lifecycle (created/updated/deleted),
    things.v1.relations (partOf set/removed).
    K1-låst (2026-09-22): deskriptorn bär additivt alternativeName/subType
    (NameOrID = alternativeName > name > thingId; TypeName = subType >
    thingType); konsumenttid EventTimestamp = max(values[].observedAt);
    field-vägar values.<property>.{value,observedAt,quality,unit,source};
    kvalitet ok/uncertain emitteras, invalid hoppar property, required
    saknad/invalid hoppar entitet; trace endast headers/OTel.
    Exempel: docs/CONSUMER-BINDING.md. HTTP-scheman nedan är läsytan (/api/v1),
    inte eventkontraktet (se pkg/types + docs/CONSUMER-BINDING.md).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Catalog
  - name: Things
paths:
  /catalog/templates:
    get:
      tags: [Catalog]
      summary: Lista publicerade mallversioner
      parameters:
        - name: category
          in: query
          description: Filtrera på kategori (t.ex. formulär för en saktyp).
          schema: { type: string }
      responses:
        '200':
          description: Mallar
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateSpec'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Catalog]
      summary: Publicera en mallversion (oföränderlig)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateSpec'
      responses:
        '201': { description: Mall publicerad }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /catalog/templates/{id}/{version}:
    get:
      tags: [Catalog]
      summary: Hämta en publicerad mallversion
      parameters:
        - $ref: '#/components/parameters/CatalogId'
        - $ref: '#/components/parameters/CatalogVersion'
      responses:
        '200':
          description: Mall
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateSpec'
        '404': { $ref: '#/components/responses/NotFound' }
  /catalog/variants:
    get:
      tags: [Catalog]
      summary: Lista publicerade variantversioner
      responses:
        '200':
          description: Varianter
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VariantSpec'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Catalog]
      summary: Publicera en variantversion låst till exakt mallversion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantSpec'
      responses:
        '201': { description: Variant publicerad }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /catalog/variants/{id}/{version}:
    get:
      tags: [Catalog]
      summary: Hämta en publicerad variantversion
      parameters:
        - $ref: '#/components/parameters/CatalogId'
        - $ref: '#/components/parameters/CatalogVersion'
      responses:
        '200':
          description: Variant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantSpec'
        '404': { $ref: '#/components/responses/NotFound' }
  /things:
    get:
      tags: [Things]
      summary: Lista saker med filter och paging (slås ihop över alla auktoriserade tenants)
      parameters:
        - $ref: '#/components/parameters/Tenant'
        - name: template
          in: query
          schema: { type: string }
        - name: templateVersion
          in: query
          schema: { type: string }
        - name: variant
          in: query
          schema: { type: string }
        - name: name
          in: query
          description: Delsträng på namn (skiftlägesokänslig).
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: bbox
          in: query
          description: minLon,minLat,maxLon,maxLat (WGS84).
          schema: { type: string }
        - name: near
          in: query
          description: lon,lat,radiusMeters (WGS84, radie > 0). PostGIS används ej; haversine i minnet.
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Saker (totalt antal i X-Total-Count)
          headers:
            X-Total-Count:
              description: Antal träffar före limit/offset.
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ThingSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Things]
      summary: Skapa sak från mall/variant
      description: >-
        Manuella mätvärden stöds inte (B8): kroppar som bär mätvärdesfält
        (values/value/observedAt/receivedAt/quality, även inuti properties)
        nekas med 400. Värden anländer endast via mätflödet.
        Konfigurationsparametrar (paramOverrides) är tillåtna.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectSpec'
      responses:
        '201':
          description: Sak skapad
          headers:
            ETag:
              schema: { type: string }
              description: Aktuell revision ("rev-<n>").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThingSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /things/tags:
    get:
      tags: [Things]
      summary: Lista distincta dynamiska kategoriseringstaggar (metadata["tags"], slås ihop över alla auktoriserade tenants)
      parameters:
        - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: Sorterade distincta taggar (tomt resultat är [])
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
  /things/export:
    get:
      tags: [Things]
      summary: Exportera saker som återskapbara ObjectSpec (JSON, slås ihop över alla auktoriserade tenants)
      description: >-
        Samma form som POST /api/v1/things tar: importera genom att POSTa
        varje spec mot en miljö med samma mallar. Endast saknivå-
        paramoverrides exporteras (variantärvda värden ej).
      parameters:
        - $ref: '#/components/parameters/Tenant'
      responses:
        '200':
          description: Saker som ObjectSpec (tomt resultat är [])
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectSpec'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /things/{id}:
    parameters:
      - $ref: '#/components/parameters/ThingId'
    get:
      tags: [Things]
      summary: Hämta sak med aktuella värden
      responses:
        '200':
          description: Sak
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThingSummary'
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Things]
      summary: Uppdatera sak (kräver If-Match)
      description: >-
        Manuella mätvärden stöds inte (B8): kroppar som bär mätvärdesfält
        (values/value/observedAt/receivedAt/quality, även inuti properties)
        nekas med 400. Värden anländer endast via mätflödet.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectSpec'
      responses:
        '200':
          description: Sak uppdaterad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThingSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Things]
      summary: Ta bort sak (blockeras med aktiva barn, ingen kaskad)
      description: >-
        Värdehistorik bevaras (B6); blob, aktuella värden, väntande outbox
        samt dedup/sedda ID:n försvinner; utgående relationer tas bort.
        Explicit GDPR-radering av historik: DELETE /things/{id}/history.
      responses:
        '204': { description: Sak borttagen }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /things/{id}/bindings:
    get:
      tags: [Things]
      summary: Läs sakens sensorkopplingar
      parameters:
        - $ref: '#/components/parameters/ThingId'
      responses:
        '200':
          description: Kopplingar
          content:
            application/json:
              schema:
                type: object
                required: [bindings]
                properties:
                  bindings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Binding'
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Things]
      summary: Byt sensorkopplingar utan att byta identitet/historik (kräver If-Match)
      parameters:
        - $ref: '#/components/parameters/ThingId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bindings]
              properties:
                bindings:
                  type: array
                  items:
                    $ref: '#/components/schemas/Binding'
      responses:
        '200':
          description: Kopplingar bytta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThingSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /things/{id}/relations:
    get:
      tags: [Things]
      summary: Läs sakens namngivna relationer med upplösta mål
      description: >-
        Löser varje relation mot målsaken vid läsning (inkl. partOf).
        Saknat mål (borttaget efter länkning) ger target:null —
        raden behålls så att brutna referenser syns. Inga
        relationshändelser publiceras utom partOf set/removed.
      parameters:
        - $ref: '#/components/parameters/ThingId'
      responses:
        '200':
          description: Relationer (tom lista vid relationslös sak)
          content:
            application/json:
              schema:
                type: object
                required: [relations]
                properties:
                  relations:
                    type: array
                    items:
                      $ref: '#/components/schemas/RelationResolve'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /things/{id}/config:
    get:
      tags: [Things]
      summary: Läs sakens lagrade effektiva config (underlag för redigering)
      parameters:
        - $ref: '#/components/parameters/ThingId'
      responses:
        '200':
          description: Effektiv konfiguration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveConfig'
        '404': { $ref: '#/components/responses/NotFound' }
  /things/{id}/preview:
    put:
      tags: [Things]
      summary: Förhandsgranska effektiv konfiguration utan att lagra
      description: >-
        Samma B8-skrivskydd som vid skapa/uppdatera: mätvärdesfält nekas
        med 400.
      parameters:
        - $ref: '#/components/parameters/ThingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectSpec'
      responses:
        '200':
          description: Effektiv konfiguration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveConfig'
        '400': { $ref: '#/components/responses/BadRequest' }
  /things/{id}/move:
    put:
      tags: [Things]
      summary: Flytta barns partOf-förälder atomärt (kräver If-Match)
      parameters:
        - $ref: '#/components/parameters/ThingId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parentId]
              properties:
                parentId: { type: string }
      responses:
        '200':
          description: Sak flyttad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThingSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /things/{id}/parent:
    delete:
      tags: [Things]
      summary: Koppla loss förälder utan att radera barnet (kräver If-Match)
      parameters:
        - $ref: '#/components/parameters/ThingId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Sak losskopplad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThingSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /things/{id}/upgrade/preview:
    put:
      tags: [Things]
      summary: Förhandsgranska versionsuppgradering (diff + konflikter)
      parameters:
        - $ref: '#/components/parameters/ThingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRef'
      responses:
        '200':
          description: Diff och konflikter
          content:
            application/json:
              schema:
                type: object
                properties:
                  diff:
                    $ref: '#/components/schemas/Diff'
                  conflicts:
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
  /things/{id}/upgrade:
    put:
      tags: [Things]
      summary: Aktivera versionsuppgradering (kräver If-Match; force=true tar bort motstridiga val)
      parameters:
        - $ref: '#/components/parameters/ThingId'
        - $ref: '#/components/parameters/IfMatch'
        - name: force
          in: query
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRef'
      responses:
        '200': { description: Uppgradering aktiverad }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /things/{id}/history:
    get:
      tags: [Things]
      summary: Läs egenskapshistorik (äldst först) med tidsintervall och paging
      parameters:
        - $ref: '#/components/parameters/ThingId'
        - name: property
          in: query
          description: Tom = alla egenskaper.
          schema: { type: string }
        - name: from
          in: query
          description: Undre mättidsgräns (RFC3339, inklusive).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Övre mättidsgräns (RFC3339, inklusive).
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Historikrader
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryWrite'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Things]
      summary: Radera sakens värdehistorik (K6 GDPR-radering)
      description: >-
        Tar bort värdehistorik och väntande värdesevent för
        saken. Fungerar för levande och borttagna saker; idempotent 204
        utan blob-uppslagning (röjer aldrig existens).
        Livscykel-/relationshändelser, dedup-markörer, sedda ID:n, sakblobb
        och katalog påverkas inte: fullständig radering = DELETE sak +
        DELETE historik.
      parameters:
        - $ref: '#/components/parameters/ThingId'
      responses:
        '204': { description: Historik raderad (eller saknas) }
        '500': { $ref: '#/components/responses/InternalError' }
  /things/{id}/overview:
    get:
      tags: [Things]
      summary: Förälder + direkta barns aktuella värden
      parameters:
        - $ref: '#/components/parameters/ThingId'
      responses:
        '200':
          description: Översikt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '404': { $ref: '#/components/responses/NotFound' }
  /things/{id}/tree:
    get:
      tags: [Things]
      summary: Begränsat underträd med aktuella värden
      parameters:
        - $ref: '#/components/parameters/ThingId'
        - name: depth
          in: query
          description: Barnnivåer att följa (0 = bara saken, max 10, standard 1).
          schema: { type: integer, minimum: 0, maximum: 10, default: 1 }
      responses:
        '200':
          description: Underträd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeNode'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ThingId:
      name: id
      in: path
      required: true
      schema: { type: string }
    CatalogId:
      name: id
      in: path
      required: true
      schema: { type: string }
    CatalogVersion:
      name: version
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: Max antal rader (0/utelämnad = alla).
      schema: { type: integer, minimum: 0 }
    Tenant:
      name: tenant
      in: query
      description: Filtrera till en tenant (måste vara auktoriserad). Utelämnad = alla auktoriserade tenants (läsningar); skrivningar kräver entydighet.
      schema: { type: string }
    Offset:
      name: offset
      in: query
      description: Hoppa över de första raderna.
      schema: { type: integer, minimum: 0 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Aktuell revision som ETag ("rev-<n>").
      schema: { type: string }
  responses:
    BadRequest:
      description: Ogiltig begäran
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Saknar autentisering/behörighet (eller tvetydig tenant)
    NotFound:
      description: "Okänd resurs (tenant-isolerad: även otillåten läsning ger 404)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Versionskonflikt (stale revision) eller oföränderlighetsbrott
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Lagringsfel (aldrig tyst framgång vid radering)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Location:
      type: object
      description: GeoJSON Point eller Polygon (lon/lat, WGS84).
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Point, Polygon]
        coordinates: {}
    Property:
      type: object
      properties:
        id: { type: string }
        displayName: { type: string }
        dataType: { type: string }
        quantity: { type: string }
        unit: { type: string }
        description: { type: string }
    Binding:
      type: object
      description: >-
        Kopplar en signal (enhet, [kanal,] objekt, resurs) till en namngiven
        ingång. Tom channel matchar alla kanaler.
      required: [deviceID, object, resource, input]
      properties:
        deviceID: { type: string }
        channel: { type: string }
        object: { type: string }
        resource: { type: string }
        input: { type: string }
    RelationSpec:
      type: object
      properties:
        name: { type: string }
        allowedTargets:
          type: array
          items: { type: string }
        min: { type: integer }
        max: { type: integer }
    RelationResolve:
      type: object
      description: >-
        Namngiven relation med målet upplöst vid läsning. target är null
        när målet saknas (borttaget efter länkning). Nyckeln finns alltid
        (nullable, required) så att GUI/genererade klienter kan skilja
        saknat mål från trasigt kontrakt.
      required: [name, targetThingId, target]
      properties:
        name: { type: string }
        targetThingId: { type: string }
        target:
          allOf:
            - $ref: '#/components/schemas/ThingSummary'
          nullable: true
    Template:
      type: object
      required: [id, version]
      properties:
        id: { type: string }
        version: { type: string }
        required:
          type: array
          items: { type: string }
        optional:
          type: array
          items: { type: string }
        repeatGroups:
          type: array
          items: { type: string }
        allowedQuantities:
          type: array
          items: { type: string }
        allowedGeometries:
          type: array
          description: Tillåtna GeoJSON-typer för platsen (Point/Polygon). Tomt = båda.
          items:
            type: string
            enum: [Point, Polygon]
        allowNoLocation:
          type: boolean
          description: Tillåt saker utan plats. Default false = plats krävs.
        relations:
          type: array
          items:
            $ref: '#/components/schemas/RelationSpec'
        category: { type: string }
        labels:
          type: array
          items: { type: string }
        primaryProperty: { type: string }
        displayName:
          type: string
          description: Visningsnamn för GUI (ID:t är tekniskt).
        description:
          type: string
          description: Beskrivning för GUI.
        propertyDefs:
          type: object
          description: Egenskapsdefinitioner per egenskaps-ID för formulärbyggande.
          additionalProperties:
            $ref: '#/components/schemas/PropertyDef'
    SignalHint:
      type: object
      description: Kompatibel sensorsignal (URN + resurs). Hint, styr aldrig bindningar.
      required: [object, resource]
      properties:
        object: { type: string }
        resource: { type: string }
    PropertyDef:
      type: object
      properties:
        displayName: { type: string }
        description: { type: string }
        dataType: { type: string }
        quantity: { type: string }
        unit: { type: string }
        signals:
          type: array
          items:
            $ref: '#/components/schemas/SignalHint'
    ParamDef:
      type: object
      description: Parameterdokumentation (enhet, beskrivning, intervall). Intervall valideras vid publicering, variant och override.
      properties:
        unit: { type: string }
        description: { type: string }
        min: { type: number }
        max: { type: number }
    Recipe:
      type: object
      required: [name, operator, inputs, outputs]
      properties:
        name: { type: string }
        operator:
          type: string
          description: >-
            distanceToLevel/level v1 beräknar lodrät nedåtriktad geometri
            (K2: nivå = sensorToBottom − distans). Vinkel (angle) och andra
            geometrier stöds inte; vinkelparametrar och extra
            receptparametrar nekas vid publicering.
        version: { type: string }
        inputs:
          type: array
          items: { type: string }
        outputs:
          type: array
          items: { type: string }
        params:
          type: array
          items: { type: string }
    TemplateSpec:
      type: object
      required: [template]
      properties:
        template:
          $ref: '#/components/schemas/Template'
        paramDefaults:
          type: object
          additionalProperties: { type: number }
        overridable:
          type: array
          items: { type: string }
        paramInfo:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ParamDef'
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/Recipe'
        operatorVersions:
          type: object
          additionalProperties: { type: string }
    Variant:
      type: object
      required: [id, version, templateId, templateVersion]
      properties:
        id: { type: string }
        version: { type: string }
        templateId: { type: string }
        templateVersion: { type: string }
        paramValues:
          type: object
          additionalProperties: { type: number }
    VariantSpec:
      type: object
      required: [variant]
      properties:
        variant:
          $ref: '#/components/schemas/Variant'
        presetProperties:
          type: array
          items: { type: string }
    RelationRef:
      type: object
      required: [name, targetThingId]
      properties:
        name: { type: string }
        targetThingId: { type: string }
        targetTemplateId: { type: string }
    ObjectSpec:
      type: object
      required: [thingId, name, location, templateId, templateVersion]
      properties:
        thingId: { type: string }
        name: { type: string }
        alternativeName:
          type: string
          description: "K1: valfritt alternativnamn. NameOrID = alternativeName > name > thingId."
        subType:
          type: string
          description: "K1: valfri subtyp. TypeName = subType > thingType. Får inte innehålla /."
        category: { type: string }
        location:
          $ref: '#/components/schemas/Location'
        metadata:
          type: object
          additionalProperties: { type: string }
        templateId: { type: string }
        templateVersion: { type: string }
        variantId: { type: string }
        variantVersion: { type: string }
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Property'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/Binding'
        paramOverrides:
          type: object
          additionalProperties: { type: number }
        relations:
          type: array
          items:
            $ref: '#/components/schemas/RelationRef'
    EffectiveConfig:
      allOf:
        - $ref: '#/components/schemas/ObjectSpec'
        - type: object
          properties:
            paramValues:
              type: object
              additionalProperties: { type: number }
            paramSources:
              type: object
              additionalProperties:
                type: string
                enum: [template, variant, thing]
            recipes:
              type: array
              items:
                $ref: '#/components/schemas/Recipe'
            primaryProperty:
              type: string
              description: Mallens primaryProperty, ärvd till saken.
    PropertyValue:
      type: object
      required: [propertyId, observedAt]
      properties:
        propertyId: { type: string }
        displayName: { type: string }
        value: { type: number, nullable: true }
        quality:
          type: string
          enum: [ok, uncertain, invalid]
        unit: { type: string }
        observedAt: { type: string, format: date-time }
        source: { type: string }
    ThingSummary:
      type: object
      required: [thingId, tenant, name, location, category, templateId, templateVersion, revision]
      properties:
        thingId: { type: string }
        tenant: { type: string }
        name: { type: string }
        alternativeName:
          type: string
          description: "K1: valfritt alternativnamn. NameOrID = alternativeName > name > thingId."
        subType:
          type: string
          description: "K1: valfri subtyp. TypeName = subType > thingType."
        category: { type: string }
        location:
          $ref: '#/components/schemas/Location'
        metadata:
          type: object
          additionalProperties: { type: string }
        templateId: { type: string }
        templateVersion: { type: string }
        variantId: { type: string }
        variantVersion: { type: string }
        revision: { type: integer }
        values:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PropertyValue'
        primary:
          $ref: '#/components/schemas/PropertyValue'
          description: "Mallens primaryProperty upplöst mot aktuella värden (GUI:ns huvuddata). Saknas när mallen saknar primaryProperty eller egenskapen inte är aktiverad."
        paramValues:
          type: object
          additionalProperties: { type: number }
        paramSources:
          type: object
          additionalProperties:
            type: string
            enum: [template, variant, thing]
    HistoryWrite:
      type: object
      required: [propertyId, observedAt, receivedAt]
      properties:
        propertyId: { type: string }
        value: { type: number, nullable: true }
        quality:
          type: string
          enum: [ok, uncertain, invalid]
        observedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        source: { type: string }
        messageId: { type: string }
        late: { type: boolean }
    VersionRef:
      type: object
      required: [templateId, templateVersion]
      properties:
        templateId: { type: string }
        templateVersion: { type: string }
        variantId: { type: string }
        variantVersion: { type: string }
    Diff:
      type: object
      properties:
        addedProperties:
          type: array
          items: { type: string }
        removedProperties:
          type: array
          items: { type: string }
        addedParams:
          type: array
          items: { type: string }
        removedParams:
          type: array
          items: { type: string }
        changedRecipes:
          type: array
          items: { type: string }
    Overview:
      type: object
      required: [thing]
      properties:
        thing:
          $ref: '#/components/schemas/ThingSummary'
        children:
          type: array
          items:
            $ref: '#/components/schemas/ThingSummary'
    TreeNode:
      type: object
      required: [thing]
      properties:
        thing:
          $ref: '#/components/schemas/ThingSummary'
        children:
          type: array
          items:
            $ref: '#/components/schemas/TreeNode'
