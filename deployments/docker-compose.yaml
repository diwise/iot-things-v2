# Isolerad drill-miljö för iot-things-v2 (Etapp 7 + K4).
#
# Tjänsten delar aldrig tillstånd med iot-things v1: egen databas,
# egen broadcast-prenumeration, egna topics. Med POSTGRES_HOST satt kör
# tjänsten PostgreSQL-backenden (migrationer appliceras vid start);
# tom värd ger minnesbackend (dev/test). Sätt RABBITMQ_DISABLED=true
# för rent API-test utan broker.

services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    environment:
      # Matchar tjänstens RABBITMQ_USER/PASS nedan (messaging-golang läser
      # samma variabler). Default-imagen har annars bara guest/guest som
      # inte får ansluta remote, så drillen skulle aldrig koppla upp.
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: bitnami
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres:
    image: timescale/timescaledb-ha:pg16
    hostname: postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: diwise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - iot-things-v2-pgdata:/var/lib/postgresql/data

  iot-things-v2:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
      - "8001:8000"
    volumes:
      # Drill-only OPA-policy (statisk drill-token, tenant "drill").
      # Ersätter aldrig den bakade produktionspolicyn utanför drillen.
      - ./drill-authz.rego:/opt/diwise/config/drill-authz.rego:ro
    environment:
      POLICIES_FILE: /opt/diwise/config/drill-authz.rego
      LISTEN_ADDRESS: "0.0.0.0"
      SERVICE_PORT: "8080"
      CONTROL_PORT: "8000"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_VHOST: "/"
      RABBITMQ_USER: user
      RABBITMQ_PASS: bitnami
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DBNAME: diwise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_SSLMODE: disable
      LOG_LEVEL: debug

volumes:
  iot-things-v2-pgdata:
